<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!--
  M²L 程序图标 · 方案 H「左右渗透」的整块科技方块版 · 无网格

  原图是一个立方体：顶点 T(256,46) R(438,151) C(256,256) L(74,151)
  BR(438,361) B(256,466) BL(74,361)，x=256 那条竖线是近处的棱 C→B。
  这里三个面都铺科技材质，凑成完整的方块。

  草皮折线取草方块两个面各自的底缘，不是镜像；右面整条上移一格 13.125，
  与左面那条在近处竖棱上接成一点 (256,308.5)。
-->
  <defs>
    <linearGradient id="tech-top" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="256">
      <stop offset="0" stop-color="#224c6a" />
      <stop offset="1" stop-color="#193f59" />
    </linearGradient>
    <linearGradient id="tech-face" gradientUnits="userSpaceOnUse" x1="0" y1="151" x2="0" y2="466">
      <stop offset="0" stop-color="#173a52" />
      <stop offset="1" stop-color="#0f2737" />
    </linearGradient>
    <linearGradient id="wire-grad" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="466">
      <stop offset="0" stop-color="#3ee0c6" />
      <stop offset="0.55" stop-color="#24c4ff" />
      <stop offset="1" stop-color="#4f8cff" />
    </linearGradient>
    <clipPath id="cube-clip"><path d="M256,46 L438,151 L438,361 L256,466 L74,361 L74,151 Z" /></clipPath>
  </defs>

  <g clip-path="url(#cube-clip)">
    <polygon points="256,46 438,151 256,256 74,151" fill="url(#tech-top)" />
    <polygon points="74,151 256,256 256,466 74,361" fill="url(#tech-face)" />
    <polygon points="438,151 256,256 256,466 438,361" fill="url(#tech-face)" />

    <g fill="none" stroke="url(#wire-grad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- 草皮折线：左面那条原样，右面那条上移一格，两段在棱上接成一点 -->
      <path d="M74,203.5 L85.38,210.06 L96.75,216.62 L96.75,242.88 L108.12,249.44 L108.12,223.19 L119.5,229.75 L119.5,242.88 L130.88,249.44 L130.88,236.31 L142.25,242.88 L142.25,269.12 L153.62,275.69 L153.62,262.56 L165,269.12 L165,256 L176.38,262.56 L176.38,275.69 L187.75,282.25 L187.75,295.38 L199.12,301.94 L199.12,275.69 L210.5,282.25 L221.88,288.81 L221.88,315.06 L233.25,321.62 L233.25,308.5 L244.62,315.06 L244.62,301.94 L256,308.5 L267.38,301.94 L267.38,315.06 L278.75,308.5 L290.12,301.94 L290.12,275.69 L301.5,269.12 L301.5,295.38 L312.88,288.81 L324.25,282.25 L324.25,269.12 L335.62,262.56 L347,256 L347,269.12 L358.38,262.56 L369.75,256 L369.75,242.88 L381.12,236.31 L392.5,229.75 L392.5,242.88 L403.88,236.31 L415.25,229.75 L415.25,203.5 L426.62,196.94 L438,190.38" stroke-width="2.5" opacity="0.5" />

      <path d="M256,46 L438,151 L438,361 L256,466 L74,361 L74,151 Z" stroke-width="2.5" opacity="0.45" />
      <path d="M256,256 L256,466" stroke-width="2.5" opacity="0.45" />
      <path d="M438,151 L256,256" stroke-width="2.5" opacity="0.45" />
      <path d="M74,151 L256,256" stroke-width="2.5" opacity="0.45" />
    </g>
  </g>
</svg>
