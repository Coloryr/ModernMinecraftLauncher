<!--
  M²L 程序图标 · 方案 F「拼接」· 科技整块 + 左面草皮

  f-tech 把右半科技补成了整块；这一版再把 f-blend 左半的草皮搬回来，只贴在左面：
  棕面 #835f42 + 绿色草皮带 #74a632 + 颗粒，上沿贴顶棱，下沿那条像素台阶压一条蓝线。
  顶面与右面仍是科技：整块顶面、右面暗面板 + 台阶折线，外轮廓与前棱的发光照旧。

  蓝线与右面那条同规格（6px、0.95 不透明、不发光）：一条沿草皮底缘，一条沿右面台阶，
  两条在中心前棱处各走各的，不连成对称图形。
-->
