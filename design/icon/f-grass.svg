<!--
  M²L 程序图标 · 方案 F「拼接」· 草方块整块

  方案 F 的左半是草方块、右半是科技方块。这一版只取左半，补成一整块草方块：
  左面与草皮带照抄 f-blend 左半，右面按右面的草皮台阶补出来，顶面铺满。
  两面不做镜像复制：右面基色压暗一档，草皮带也是右面自己的深浅。

  左半：顶面 #7db63e / 左面 #835f42 / 草皮带 #74a632
  右半：右面 #76543a / 草皮带 #5f8a28
  颗粒沿用 f-blend 的 grain-top / grain-side-left / grain-side-right 三套。

  台阶边沿：左面那条就是 f-blend 左半的草皮底缘，右面那条是草方块右面的原版，
  两条在中心前棱处各走各的，不对齐成一条线。
-->
