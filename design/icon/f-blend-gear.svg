<!--
  M²L 程序图标 · 方案 F「拼接」

  一个方块，沿中轴线 x=256 一分为二，硬接缝：左半是原始草方块，右半是科技方块。

  科技感的线只属于右半：
    - 科技半整体裁到 right-clip（T → R → BR → B 这个四边形，就是右半的轮廓），
      所以外轮廓、光晕全在右半以内，两半看起来一样大。
    - 左半只有纯色面 + 草皮台阶 + 颗粒，没有任何描边或发光。

  中线单独画一条，居中于 x=256，左右各 7px：它不属于任何一半，所以两条边
  一样宽，不受右半裁剪。冷白渐变像一道光缝，在草皮与暗面板上都够亮。

  左半：顶 #7db63e / 左面 #835f42。
  右半：暗面板 + 草皮台阶折线 + 发光棱线。
  节点圆点去掉了：R / BR 在轮廓角上，圆点会凸出 7px，破坏"两半一样大"。

  方案 F + 齿轮：在右半（科技半）压一枚齿轮徽章，表示"可调的主题/设置"，
  整体用暖金色，与科技线的青色区分开；圆心到右下棱留 12px 余量，整枚徽章在 right-clip 内。
-->
