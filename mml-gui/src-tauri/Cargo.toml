[package]
name = "mml-gui"
version = "0.0.1"
description = "M²L Launcher"
authors = ["coloryr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mml_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }
gui-ipc-gen = { path = "../../ipc-gen" }

[dependencies]
# tray-icon：主窗口关掉后进程留在后台（继续给运行中的游戏计时），托盘负责唤回界面
tauri = { version = "~2.12.5", features = ["tray-icon"] }
base64.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-decoration = { path = "../../target/vendor/tauri-plugin-decoration" }
async-trait.workspace = true
gui-macros = { path = "../../ipc-gen/macros" }
serde.workspace = true
serde_json.workspace = true
font-kit.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
tiny-skia.workspace = true
image.workspace = true
rfd.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zip.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
reqwest.workspace = true

mml-core = { path = "../../mml-core" }
mml-game = { path = "../../mml-core/mml-game" }
mml-config = { path = "../../mml-core/mml-config" }
mml-jvms = { path = "../../mml-core/mml-jvms" }
# 单开与唤回：端口记录、通知已运行实例、接收显示 / 参数请求
mml-ipc = { path = "../../mml-core/mml-ipc" }
mml-downloader = { path = "../../mml-core/mml-downloader" }
mml-sys = { path = "../../mml-core/mml-sys" }
mml-net = { path = "../../mml-core/mml-net" }
mml-log = { path = "../../mml-core/mml-log" }
mml-base = { path = "../../mml-core/mml-base" }
mml-auth = { path = "../../mml-core/mml-auth" }
mml-names = { path = "../../mml-core/mml-names" }
mml-nbt = { path = "../../mml-core/mml-nbt" }
mml-skin = { path = "../../mml-core/mml-skin" }
mml-skin-draw = { path = "../../mml-core/mml-skin-draw" }
mml-tex-draw = { path = "../../mml-core/mml-tex-draw" }
mml-analysis = { path = "../../mml-core/mml-analysis" }
window-vibrancy.workspace = true

[dev-dependencies]
# 测试临时目录统一放 target/temp（AGENTS.md §6）：不要用系统 %TEMP%，也不要自己拼仓库根
mml-testutil = { path = "../../mml-core/mml-testutil" }

[target.'cfg(windows)'.dependencies]
# 文件拖放的"路径桥"（见 src/windows/file_drop.rs）：
# 用 WebView2 的"附加对象"通道把 DOM 拖入的文件真实路径捞回来
webview2-com = "~0.39.1"
# 与 tauri / webview2-com 同一个 windows 版本（0.62），PCWSTR / PWSTR 才通用
windows.workspace = true

[features]
# 前端资源走内嵌 dist 而不是 devUrl。**直接 cargo build 必须显式打开**：
# tauri 的 build.rs 用 `dev = !custom-protocol` 判定，不带这个 feature 时哪怕
# profile 是 release-like 也会被当成 dev 构建 —— 那时 exe 会去连 localhost:1420，
# 没起 vite 就是"进程在跑、窗口不出来"。tauri CLI 自己会带上，走 tauri build 不用管。
custom-protocol = ["tauri/custom-protocol"]

# 预发布版标记：预发布构建（build/build-prerelease.*）打开它，主页会提示"预发布版"。
# 正式发布不带，前端据 app_build_info 的 channel 决定提示与否。
prerelease = []
