[package]
name = "mml-sys"
version = "0.1.0"
edition = "2024"

[dependencies]
mml-names = { path = "../mml-names" }
uuid.workspace = true
base64.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(not(windows))'.dependencies]
# Windows 侧剪贴板直接调 Win32（见 clipboard_helper）；其它平台仍用 clipboard-rs
clipboard-rs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
winreg.workspace = true

[dev-dependencies]
mml-testutil = { path = "../mml-testutil" }

[target.'cfg(windows)'.dev-dependencies]
# 集成测试直接按 Win32 读回剪贴板，不再为测试把 clipboard-rs 链回 Windows
windows.workspace = true
