<!doctype html>
<html lang="zh-CN" data-theme="Dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 自绘标题栏的插件样式表走 tauri-plugin-decoration: 协议，style-src 必须放行，否则激活会因 stylesheet-load 失败 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' tauri-plugin-decoration: http://tauri-plugin-decoration.localhost https://tauri-plugin-decoration.localhost; style-src-elem 'self' 'unsafe-inline' tauri-plugin-decoration: http://tauri-plugin-decoration.localhost https://tauri-plugin-decoration.localhost; worker-src 'self' blob:; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:1421; frame-src http://127.0.0.1:*" />
    <title>M²L Theme Studio</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
