name: 构建与发布

on:
  push:
    branches:
      - 'releases/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mml-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 校验 build/version 与标签
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '\r\n' < build/version)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "build/version 是 ${version}，标签是 ${GITHUB_REF_NAME}，两者不一致。"
            exit 1
          fi
          echo "版本 ${version} 与标签一致。"

  build-windows:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-latest
            arch: x86
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.arch }}
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          # tauri-cli 的 binstall 元数据只给 x64 的 zip 包写了格式覆盖，macOS / Windows
          # 的 ARM64 产物其实也是 zip。按平台显式指定格式，避免回退到源码编译。
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 安装依赖
        run: pwsh -NoProfile -File build/init.ps1
      - name: 构建并打包（${{ matrix.arch }}）
        run: pwsh -NoProfile -File build/build-release.ps1 -Arch ${{ matrix.arch }}
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: mml-windows-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error

  build-linux:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            fuse: libfuse2
          - runner: ubuntu-24.04-arm
            arch: arm64
            fuse: libfuse2t64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          if ! apt-cache show "${{ matrix.fuse }}" >/dev/null 2>&1; then
            echo "找不到 ${{ matrix.fuse }}，当前可用的 libfuse 包："
            apt-cache search '^libfuse'
            exit 1
          fi
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev \
            libgtk-3-dev ${{ matrix.fuse }} rpm libdbus-1-dev libudev-dev \
            libarchive-tools zstd
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          # tauri-cli 的 binstall 元数据只给 x64 的 zip 包写了格式覆盖，macOS / Windows
          # 的 ARM64 产物其实也是 zip。按平台显式指定格式，避免回退到源码编译。
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 安装依赖
        run: bash build/init.sh
      - name: 构建并打包
        run: bash build/build-release.sh
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: mml-linux-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error
      - name: 上传 Linux x64 二进制
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bin
          path: target/release/mml-gui
          if-no-files-found: error

  package-linux-extra:
    needs: [build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak libarchive-tools zstd
      - name: 下载 Linux x64 二进制
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-bin
          path: target/release
      - name: 恢复可执行权限
        run: chmod +x target/release/mml-gui
      - name: 打 Flatpak 包
        run: bash build/package-flatpak.sh
      - name: 打 Arch 包
        run: bash build/package-arch.sh
      - name: 上传附加包
        uses: actions/upload-artifact@v4
        with:
          name: mml-linux-x64-extra
          path: |
            build_out/*.flatpak
            build_out/*.pkg.tar.zst
          if-no-files-found: error

  build-macos:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 检查签名配置
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=0
          notarized=0
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            signed=1
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notarized=1
          fi
          if [ "$signed" = 1 ] && [ "$notarized" = 1 ]; then
            echo 'macOS 签名与公证已配置。'
          elif [ "$signed" = 1 ]; then
            echo '只配置了签名证书，没有公证凭据：Gatekeeper 仍会拦首次打开。'
          else
            echo '未配置 macOS 签名：产物未签名，用户首次打开需右键 → 打开。'
          fi
      - name: 安装依赖
        run: bash build/init.sh
      - name: 构建并打包
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done
          bash build/build-release.sh
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: mml-macos-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, build-windows, build-linux, package-linux-extra, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: mml-*
          merge-multiple: false
          path: artifacts
      - name: 检查产物重名
        shell: bash
        run: |
          dupes="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo '发现重名产物：'
            printf '%s\n' "$dupes"
            exit 1
          fi
          echo '产物无重名。'
      - name: 列出产物
        run: find artifacts -type f -print
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: M²L ${{ github.ref_name }}
          body: |
            M²L ${{ github.ref_name }} 构建产物

            - Windows：x64 / x86 / arm64（MSI / NSIS；arm64 为 NSIS）
            - Linux：x64 / arm64（deb / rpm / AppImage；x64 另有 Flatpak / Arch）
            - macOS：x64 / arm64（dmg / app.tar.gz）
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
