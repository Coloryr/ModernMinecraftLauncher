name: 构建与发布

on:
  push:
    branches:
      - 'releases/**'
    tags:
      # 带 v 与不带 v 都认：版本号取自标签，开头的 v 会被剥掉
      - '[0-9]*'
      - 'v[0-9]*'
      - 'testbuild*'

permissions:
  contents: write

concurrency:
  group: mml-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      test: ${{ steps.resolve.outputs.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 版本取自标签：浅克隆不带标签与历史，git describe 无从下手
          fetch-depth: 0
      - name: 解析版本与发布通道
        id: resolve
        shell: bash
        run: |
          # 测试构建标签：跑完整构建流程，但产物一律丢弃，版本取最近的版本标签
          test=false
          if [[ "$GITHUB_REF" == refs/tags/testbuild* ]]; then
            test=true
          fi

          # 发版标签本身就是版本号；分支推送上没有标签，留给脚本回落到最近的标签
          if [ "$test" = false ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export MML_VERSION="$GITHUB_REF_NAME"
          fi
          version="$(node build/version.mjs)"

          if [[ "$version" == *-* ]]; then
            channel=prerelease
          else
            channel=release
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "test=${test}" >> "$GITHUB_OUTPUT"
          echo "版本=${version}，发布通道=${channel}，测试构建=${test}"

          if [ "$test" = true ]; then
            echo "测试构建：产物全部丢弃，不上传 artifact、不发 Release。"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "发版标签 ${GITHUB_REF_NAME}，版本 ${version}。"
          fi

  build-windows:
    needs: check-version
    env:
      # 版本由 check-version 从标签解析，构建机是浅克隆，自己取不到标签
      MML_VERSION: ${{ needs.check-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 还原 vendor 插件
        run: pwsh -NoProfile -File mml-gui/vendor/prepare.ps1
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.arch }}
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 安装依赖
        run: pwsh -NoProfile -File build/init.ps1
      - name: 构建并打包（${{ matrix.arch }}）
        if: needs.check-version.outputs.channel == 'release'
        run: pwsh -NoProfile -File build/build-release.ps1 -Arch ${{ matrix.arch }}
      - name: 上传 Windows 产物
        if: needs.check-version.outputs.channel == 'release' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-windows-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error
      - name: 构建预发布（${{ matrix.arch }}）
        if: needs.check-version.outputs.channel == 'prerelease'
        run: pwsh -NoProfile -File build/build-prerelease.ps1 -Arch ${{ matrix.arch }}
      - name: 收集预发布产物
        if: needs.check-version.outputs.channel == 'prerelease'
        run: node build/package-prerelease.mjs --os windows --arch ${{ matrix.arch }}
      - name: 上传预发布产物
        if: needs.check-version.outputs.channel == 'prerelease' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-prerelease-windows-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error

  build-linux:
    needs: check-version
    env:
      MML_VERSION: ${{ needs.check-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            fuse: libfuse2
          - runner: ubuntu-24.04-arm
            arch: arm64
            fuse: libfuse2t64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 还原 vendor 插件
        run: bash mml-gui/vendor/prepare.sh
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          if ! apt-cache show "${{ matrix.fuse }}" >/dev/null 2>&1; then
            echo "找不到 ${{ matrix.fuse }}，当前可用的 libfuse 包："
            apt-cache search '^libfuse'
            exit 1
          fi
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev \
            libgtk-3-dev ${{ matrix.fuse }} rpm libdbus-1-dev libudev-dev \
            libarchive-tools zstd
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 安装依赖
        run: bash build/init.sh
      - name: 构建并打包
        if: needs.check-version.outputs.channel == 'release'
        run: bash build/build-release.sh
      - name: 上传 Linux 产物
        if: needs.check-version.outputs.channel == 'release' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-linux-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error
      - name: 上传 Linux x64 二进制
        if: needs.check-version.outputs.channel == 'release' && matrix.arch == 'x64' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-bin
          # tauri build 会按 productName 重命名产物；两种名字都收，版本行为有差异时也不空手
          path: |
            target/release/ModernMinecraftLauncher
            target/release/mml-gui
          if-no-files-found: error
      - name: 构建预发布
        if: needs.check-version.outputs.channel == 'prerelease'
        run: bash build/build-prerelease.sh
      - name: 收集预发布产物
        if: needs.check-version.outputs.channel == 'prerelease'
        run: node build/package-prerelease.mjs --os linux --arch ${{ matrix.arch }}
      - name: 上传预发布产物
        if: needs.check-version.outputs.channel == 'prerelease' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-prerelease-linux-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error

  package-linux-extra:
    if: needs.check-version.outputs.channel == 'release' && needs.check-version.outputs.test != 'true'
    needs: [check-version, build-linux]
    runs-on: ubuntu-22.04
    env:
      MML_VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak libarchive-tools zstd
      - name: 下载 Linux x64 二进制
        uses: actions/download-artifact@v7
        with:
          name: linux-x64-bin
          path: target/release
      - name: 恢复可执行权限
        run: chmod +x target/release/ModernMinecraftLauncher
      - name: 打 Flatpak 包
        run: bash build/package-flatpak.sh
      - name: 打 Arch 包
        run: bash build/package-arch.sh
      - name: 上传附加包
        uses: actions/upload-artifact@v6
        with:
          name: mml-linux-x64-extra
          path: |
            build_out/*.flatpak
            build_out/*.pkg.tar.zst
          if-no-files-found: error

  build-macos:
    needs: check-version
    env:
      MML_VERSION: ${{ needs.check-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mml-vue/package-lock.json
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 还原 vendor 插件
        run: bash mml-gui/vendor/prepare.sh
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装 cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: 安装 Tauri CLI（预编译）
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pkg_fmt=tgz ;;
            *) pkg_fmt=zip ;;
          esac
          cargo binstall --no-confirm --pkg-fmt "$pkg_fmt" tauri-cli@^2
          cargo tauri --version
      - name: 检查签名配置
        if: needs.check-version.outputs.channel == 'release'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=0
          notarized=0
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            signed=1
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notarized=1
          fi
          if [ "$signed" = 1 ] && [ "$notarized" = 1 ]; then
            echo 'macOS 签名与公证已配置。'
          elif [ "$signed" = 1 ]; then
            echo '只配置了签名证书，没有公证凭据：Gatekeeper 仍会拦首次打开。'
          else
            echo '未配置 macOS 签名证书：产物会做 ad-hoc 签名，用户首次打开仍需手动放行。'
          fi
      - name: 安装依赖
        run: bash build/init.sh
      - name: 构建并打包
        if: needs.check-version.outputs.channel == 'release'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 没有证书也必须签名：Apple Silicon 上未签名的二进制根本起不来，Intel 上
          # 也会被 Gatekeeper 判成"已损坏"。用 ad-hoc 兜底，伪身份就是 "-"
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              export APPLE_SIGNING_IDENTITY="-"
            fi
          fi
          # 公证凭据缺任何一项都不公证：Tauri 只看变量在不在，空串会被当成已配置
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done
          bash build/build-release.sh
      - name: 上传 macOS 产物
        if: needs.check-version.outputs.channel == 'release' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-macos-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error
      - name: 构建预发布
        if: needs.check-version.outputs.channel == 'prerelease'
        run: bash build/build-prerelease.sh
      - name: 收集预发布产物
        if: needs.check-version.outputs.channel == 'prerelease'
        run: node build/package-prerelease.mjs --os macos --arch ${{ matrix.arch }}
      - name: 预发布产物 ad-hoc 签名
        if: needs.check-version.outputs.channel == 'prerelease'
        run: |
          # 预发布只有裸可执行文件，不经过 Tauri 打包，得自己签一道 ——
          # 否则 arm64 上连启动都过不去
          for f in build_out/*; do
            codesign --force --sign - "$f"
            codesign --verify --verbose=1 "$f"
          done
      - name: 上传预发布产物
        if: needs.check-version.outputs.channel == 'prerelease' && needs.check-version.outputs.test != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mml-prerelease-macos-${{ matrix.arch }}
          path: build_out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') && needs.check-version.outputs.channel == 'release' && needs.check-version.outputs.test != 'true'
    needs: [check-version, build-windows, build-linux, package-linux-extra, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 下载全部产物
        uses: actions/download-artifact@v7
        with:
          pattern: mml-*
          merge-multiple: false
          path: artifacts
      - name: 检查产物重名
        shell: bash
        run: |
          dupes="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo '发现重名产物：'
            printf '%s\n' "$dupes"
            exit 1
          fi
          echo '产物无重名。'
      - name: 列出产物
        run: find artifacts -type f -print
      - name: 生成发布说明
        run: node build/release-body.mjs --kind release --version ${{ github.ref_name }} --artifacts artifacts --out "$RUNNER_TEMP/release-body.md"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: M²L ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  prerelease:
    if: startsWith(github.ref, 'refs/tags/') && needs.check-version.outputs.channel == 'prerelease' && needs.check-version.outputs.test != 'true'
    needs: [check-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 下载预发布产物
        uses: actions/download-artifact@v7
        with:
          pattern: mml-prerelease-*
          merge-multiple: false
          path: artifacts
      - name: 检查产物重名
        shell: bash
        run: |
          dupes="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo '发现重名产物：'
            printf '%s\n' "$dupes"
            exit 1
          fi
          echo '产物无重名。'
      - name: 列出产物
        run: find artifacts -type f -print
      - name: 生成发布说明
        run: node build/release-body.mjs --kind prerelease --version ${{ github.ref_name }} --artifacts artifacts --out "$RUNNER_TEMP/release-body.md"
      - name: 创建 GitHub 预发布
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: M²L ${{ github.ref_name }} 预发布
          body_path: ${{ runner.temp }}/release-body.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
